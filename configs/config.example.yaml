# LunarGate Gateway - Example Configuration
# Copy this file to config.yaml and adjust as needed.
# Environment variables can be referenced as ${VAR_NAME}.

server:
  host: "0.0.0.0"
  port: 8080
  read_timeout: 30s
  write_timeout: 0s
  idle_timeout: 60s

# Shared gateway identity used by Dashboard integrations.
general:
  api_key: "${LUNARGATE_GATEWAY_API_KEY}"
  backend_url: "${LUNARGATE_BACKEND_URL}"

# Automatic release checks. The gateway sends only its current version and
# CPU architecture. Set enabled to false to disable all update-check traffic.
update_check:
  enabled: true
  endpoint: "${LUNARGATE_UPDATE_CHECK_ENDPOINT}"
  interval: 24h
  timeout: 3s

# LLM Provider Configuration
providers:
  openai:
    api_key: "${OPENAI_API_KEY}"
    default_model: "gpt-5.6-terra"
    organization: "${OPENAI_ORG_ID}"
    # Extended APIs are opt-in. Enable only contracts implemented by the
    # exact upstream behind base_url.
    capabilities:
      chat_completions_lifecycle: true
      responses_lifecycle: true
      conversations: true
      background_responses: true
      response_cancellation: true
      response_compaction: true
      response_input_tokens: true
      embeddings_base64: true
      hosted_tools: []

  openai-second-account:
    type: "openai"
    api_key: "${OPENAI_API_KEY2}"
    # Response-side compatibility shim only; outgoing requests are never
    # rewritten. Defaults to false, including with compatibility_profile:
    # deepseek. Enable only when complete literal <think>...</think> regions
    # are part of the upstream response contract.
    extract_reasoning_tags: false

  anthropic:
    api_key: "${ANTHROPIC_API_KEY}"
    default_model: "claude-sonnet-4-6"
    capabilities:
      structured_outputs: true
      reasoning_effort: true
      reasoning_effort_levels: [low, medium, high, max]
      adaptive_thinking: true

  abacus:
    type: "openai"
    api_key: "${ABACUS_API_KEY}"
    base_url: "https://routellm.abacus.ai/v1"
    default_model: "claude-sonnet-4-5"

# Routing Configuration
routing:
  default_strategy: "weighted"

  routes:
    - name: "openai-native-responses"
      match:
        path: "/v1/responses"
      targets:
        - provider: openai
          model: gpt-5.6-terra
          upstream_request_type: responses
          weight: 100

    - name: "complexity-tier-0-1"
      match:
        path: "/v1/chat/completions"
        headers:
          x-lunargate-complexity: "0-1"
      targets:
        - provider: openai
          model: gpt-4o-mini
          weight: 100

    - name: "complexity-tier-2-3"
      match:
        path: "/v1/chat/completions"
        headers:
          x-lunargate-complexity: "2-3"
      targets:
        - provider: openai
          model: gpt-5.6-terra
          weight: 100

    - name: "complexity-tier-4-5"
      match:
        path: "/v1/chat/completions"
        headers:
          x-lunargate-complexity: "4-5"
      targets:
        - provider: anthropic
          model: claude-sonnet-4-6
          weight: 100

    - name: "complexity-tier-6plus"
      match:
        path: "/v1/chat/completions"
        headers:
          x-lunargate-complexity: "6+"
      targets:
        - provider: abacus
          model: claude-sonnet-4-5
          weight: 100

    - name: "default"
      match:
        path: "*"
      targets:
        - provider: openai
          model: gpt-5.6-terra
          weight: 70
        - provider: openai-second-account
          model: gpt-5.6-terra
          weight: 10
        - provider: anthropic
          model: claude-sonnet-4-6
          weight: 30
      fallback:
        - provider: anthropic
          model: claude-sonnet-4-6
          weight: 100

model_selection:
  enabled: true
  override_user_model: false
  output_headers:
    complexity: "x-lunargate-complexity"
    score: "x-lunargate-complexity-score"
    skill: "x-lunargate-skill"
  complexity_scoring:
    input_tokens_threshold: 2000
    weight_input_tokens: 2
    weight_contains_code: 2
    weight_math_reasoning: 2
    weight_analysis_synthesis: 1
    weight_safety_sensitive: 2
    weight_tools: 2
  complexity_tiers:
    tier_01_max: 1
    tier_23_max: 3
    tier_45_max: 5
  skills:
    - name: "coding"
      regex_any:
        - '(?i)\b(code|bug|golang|go|python|typescript|javascript|sql)\b'
    - name: "math"
      regex_any:
        - '(?i)\b(derive|prove|integral|derivative|matrix|vector|equation)\b'

# Rate Limiting (in-memory for POC)
rate_limiting:
  enabled: true
  requests_per_minute: 60
  burst_size: 10

# Caching (in-memory exact-match for POC)
caching:
  enabled: true
  ttl: 1h
  max_size: 1000
  max_entry_bytes: 16777216 # 16 MiB
  max_bytes: 67108864 # 64 MiB total

# Retry Configuration
retry:
  enabled: true
  max_attempts: 3
  initial_delay: 1s
  max_delay: 30s
  multiplier: 2.0
  jitter_factor: 0.2
  retryable_errors: [429, 500, 502, 503, 504]

# Logging
logging:
  level: "info"    # debug, info, warn, error
  format: "console"   # json or console

# Security
security:
  enabled: false
  # Optional: enable inbound API-key auth for /v1/*
  # provider: "api_key"
  # api_key:
  #   keys:
  #     - name: "dashboard"
  #       value: "${LUNARGATE_CLIENT_API_KEY}"

# Dashboard connectivity for collector export and optional remote control.
# With `enabled: true` and both share flags false, the collector sends only its
# fixed metadata/metrics allowlist. The remote-control sandbox is separate: when
# enabled, each sandbox request and its bounded full response use the control
# channel regardless of the two collector share flags.
# Create the gateway API key in the "Gateways" section of https://app.lunargate.ai
# and set it under `general.api_key`.
data_sharing:
  enabled: false              # Master switch for collector and remote control
  share_prompts: false        # Forward user prompts to SaaS backend
  share_responses: false      # Forward LLM responses to SaaS backend
  remote_control: false       # Sandbox control channel; may carry request/response content
